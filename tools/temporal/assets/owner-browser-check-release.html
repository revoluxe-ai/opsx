<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PP — Browser check release</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #14532d;
      color: #f0fdf4;
    }
    main {
      max-width: 44rem;
      padding: 2.5rem 2rem;
      text-align: center;
      border: 1px solid #22c55e;
      border-radius: 1rem;
      background: #166534;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      line-height: 1.35;
      font-weight: 600;
    }
    p {
      margin: 0;
      color: #bbf7d0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #86efac;
      border-top: 1px solid #22c55e;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Браузерная проверка завершена — можно снова пользоваться Chrome</h1>
    <p>Агент закончил smoke-проверку в браузере. Можно переключаться на другие вкладки и сайты.</p>
    <p class="hint">Проверка завершена — можно переключаться на другие вкладки. Финал всего pipeline — отдельно (owner-done-signal).</p>
  </main>
</body>
</html>
