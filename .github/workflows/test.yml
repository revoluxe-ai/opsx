name: OPSX distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  distribution:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --require-hashes -r requirements-runtime.lock
      - run: python -m pip install -e ".[web]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q opsx_cli opsx/di opsx/opsx_runtime
      - name: Core routing and adapter boundaries
        run: python scripts/test_core_contracts.py
