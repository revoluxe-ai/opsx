<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPSX — управление Bug Team</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      color-scheme: dark;
      --bg: #08111f;
      --panel: #111c2e;
      --panel-2: #16243a;
      --border: #263956;
      --text: #eef5ff;
      --muted: #9fb0c9;
      --blue: #4f8cff;
      --blue-soft: #193765;
      --green: #46d39a;
      --green-soft: #123d36;
      --red: #ff7383;
      --red-soft: #4b202b;
      --yellow: #f7c965;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, #162c52 0, transparent 34rem),
        radial-gradient(circle at 90% 10%, #172746 0, transparent 28rem),
        var(--bg);
      color: var(--text);
    }
    main { width: min(72rem, 94vw); margin: 0 auto; padding: 2.5rem 0 5rem; }
    header { margin-bottom: 1.5rem; }
    h1 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.2rem); letter-spacing: -0.03em; }
    .subtitle { margin: 0.55rem 0 0; max-width: 50rem; color: var(--muted); line-height: 1.55; }
    .panel {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: var(--shadow);
    }
    .intake { padding: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.86rem; font-weight: 700; }
    textarea {
      width: 100%; min-height: 8.5rem; resize: vertical;
      padding: 0.85rem 0.95rem; border: 1px solid #385071; border-radius: 0.7rem;
      background: #091424; color: var(--text); font: inherit; line-height: 1.5;
    }
    textarea:focus { outline: 2px solid var(--blue); outline-offset: 2px; }
    .form-note { margin: 0.55rem 0 0; color: var(--muted); font-size: 0.78rem; }
    .actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
    button {
      border: 0; border-radius: 0.65rem; padding: 0.72rem 1rem;
      color: #fff; background: var(--blue); font: inherit; font-weight: 750; cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.55; cursor: wait; }
    button.secondary { background: #263a58; }
    button.danger { background: #9d3143; margin-left: auto; }
    #run-panel { display: none; margin-top: 1.25rem; overflow: hidden; }
    #run-panel.visible { display: block; }
    .run-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
      padding: 1.25rem; border-bottom: 1px solid var(--border);
    }
    .eyebrow { color: var(--muted); font: 0.72rem ui-monospace, monospace; word-break: break-all; }
    .run-title { margin: 0.35rem 0 0; font-size: 1.3rem; }
    .run-meta { display: flex; align-items: center; gap: 0.7rem; white-space: nowrap; }
    .badge { padding: 0.34rem 0.58rem; border-radius: 999px; font-size: 0.75rem; font-weight: 800; }
    .badge.running { color: #cfe0ff; background: var(--blue-soft); }
    .badge.completed { color: #bff5df; background: var(--green-soft); }
    .badge.failed, .badge.cancelled { color: #ffd0d5; background: var(--red-soft); }
    #elapsed { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
    .run-body { display: grid; grid-template-columns: minmax(15rem, 0.78fr) minmax(20rem, 1.4fr); }
    .timeline { margin: 0; padding: 1.25rem; list-style: none; border-right: 1px solid var(--border); }
    .stage { position: relative; display: grid; grid-template-columns: 1.7rem 1fr; gap: 0.65rem; padding: 0 0 1.1rem; }
    .stage:last-child { padding-bottom: 0; }
    .stage:not(:last-child)::before { content: ""; position: absolute; left: 0.78rem; top: 1.55rem; bottom: 0.12rem; width: 2px; background: #30425e; }
    .stage-dot {
      position: relative; z-index: 1; display: grid; place-items: center; width: 1.55rem; height: 1.55rem;
      border: 2px solid #40536f; border-radius: 50%; background: var(--panel); color: transparent; font-size: 0.72rem;
    }
    .stage.running .stage-dot { border-color: var(--blue); background: var(--blue-soft); color: #fff; animation: pulse 1.5s infinite; }
    .stage.completed .stage-dot { border-color: var(--green); background: var(--green); color: #062219; }
    .stage.failed .stage-dot, .stage.blocked .stage-dot { border-color: var(--red); background: var(--red-soft); color: #fff; }
    .stage-label { font-size: 0.88rem; font-weight: 750; }
    .stage-detail { margin-top: 0.2rem; color: var(--muted); font-size: 0.75rem; line-height: 1.35; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(79, 140, 255, 0.12); } }
    .activity-column { min-width: 0; padding: 1.25rem; }
    .activity-card { padding: 1rem; border: 1px solid #315077; border-radius: 0.75rem; background: #0c192b; }
    .activity-kicker { margin: 0; color: #8ab6ff; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
    #activity-title { margin: 0.42rem 0 0; font-size: 1.05rem; }
    #activity-detail { margin: 0.42rem 0 0; color: var(--muted); line-height: 1.45; font-size: 0.85rem; white-space: pre-wrap; }
    #result { display: none; margin-top: 1rem; padding: 1rem; border: 1px solid var(--border); border-radius: 0.75rem; background: var(--panel-2); }
    #result.visible { display: block; }
    #result h3 { margin: 0 0 0.8rem; font-size: 1.05rem; }
    .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
    .result-item { padding: 0.75rem; border-radius: 0.6rem; background: #0c1727; }
    .result-key { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .result-value { margin-top: 0.32rem; font-size: 0.84rem; line-height: 1.4; overflow-wrap: anywhere; }
    .wide { grid-column: 1 / -1; }
    .file-list, .check-list { margin: 0.35rem 0 0; padding-left: 1.15rem; }
    details { margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    summary { cursor: pointer; color: #bfd1ea; font-size: 0.85rem; font-weight: 700; }
    #log-pane {
      margin: 0.75rem 0 0; padding: 0.8rem; min-height: 5rem; max-height: min(30rem, 50vh);
      overflow: auto; border: 1px solid #243650; border-radius: 0.6rem; background: #030914;
      color: #b9c8dd; font: 0.72rem/1.45 ui-monospace, "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    .empty-log { color: #6f829d; }
    @media (max-width: 760px) {
      main { padding-top: 1.2rem; }
      .run-head { flex-direction: column; }
      .run-body { grid-template-columns: 1fr; }
      .timeline { border-right: 0; border-bottom: 1px solid var(--border); }
      .result-grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      .actions { flex-wrap: wrap; }
      button { flex: 1 1 12rem; }
      button.danger { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Починка бага</h1>
    <p class="hint">Опишите баг — запускается тот же bug-team repair, что после найденного finding (без hunt/discovery).</p>
    <form id="form" method="post" action="/repair">
      <label for="change">Change (если баг из OpenSpec change)</label>
      <input id="change" name="change" maxlength="80" placeholder="visual" />
      <label for="bug">Что не так</label>
      <textarea id="bug" name="bug" required maxlength="8000" placeholder="Ожидание, факт, шаги…"></textarea>
      <button type="submit" id="submit">Запустить repair</button>
      <button type="button" id="cancel" hidden>Остановить</button>
    </form>
    <section id="run-panel" class="run-panel" hidden>
      <div class="run-head">
        <span id="run-id"></span>
        <strong id="run-title">Repair</strong>
        <span id="run-badge" class="badge running">—</span>
        <span id="elapsed"></span>
      </div>
      <div class="run-body">
        <ul id="timeline" class="timeline" aria-label="Стадии repair"></ul>
        <div>
          <h2 id="activity-title"></h2>
          <p id="activity-detail"></p>
          <div id="result"></div>
        </div>
      </div>
    </section>
    <pre id="log-pane" aria-live="polite" aria-label="Лог repair"></pre>
  </main>

  <script>
    const STAGES = [
      { id: "intake", label: "Описание принято", detail: "Создание запуска" },
      { id: "classify", label: "Анализ проблемы", detail: "Определяем тип и причину бага" },
      { id: "red", label: "Воспроизведение — RED", detail: "Создаём тест, который падает до исправления" },
      { id: "fix", label: "Исправление кода", detail: "Вносим минимальное изменение" },
      { id: "commit", label: "Сохранение изменения", detail: "Фиксируем проверенный набор файлов" },
      { id: "green", label: "Проверка — GREEN", detail: "Подтверждаем исправление и регрессии" },
      { id: "invariant", label: "Защита от повторения", detail: "Формулируем проверяемый инвариант" },
      { id: "hunt", label: "Поиск похожих проблем", detail: "Проверяем соседние участки кода" },
      { id: "finish", label: "Итог", detail: "Собираем результаты запуска" }
    ];
    const ROLE_STAGE = {
      INTAKE: "intake", CLASSIFIER: "classify", RED_TEST_WORKER: "red",
      IMPLEMENTATION_EXECUTOR: "fix", COMMIT: "commit", GREEN_VERIFIER: "green",
      INVARIANT_CAPTURE_WORKER: "invariant", BOUNDED_HUNTER: "hunt",
      RELATION_CLASSIFIER: "hunt", FAN_IN_ASSEMBLER: "finish"
    };
    const STATE_LABEL = {
      running: "Выполняется", completed: "Завершено", failed: "Ошибка", cancelled: "Остановлено"
    };

    const form = document.getElementById("form");
    const submit = document.getElementById("submit");
    const cancel = document.getElementById("cancel");
    const runPanel = document.getElementById("run-panel");
    const runIdNode = document.getElementById("run-id");
    const runTitle = document.getElementById("run-title");
    const runBadge = document.getElementById("run-badge");
    const elapsed = document.getElementById("elapsed");
    const timeline = document.getElementById("timeline");
    const activityTitle = document.getElementById("activity-title");
    const activityDetail = document.getElementById("activity-detail");
    const resultNode = document.getElementById("result");
    const logPane = document.getElementById("log-pane");

    let activeRunId = null;
    let startedAt = null;
    let elapsedTimer = null;
    let streamAbort = null;
    let logStarted = false;
    const stageState = new Map(STAGES.map(stage => [stage.id, "pending"]));

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    function renderTimeline() {
      timeline.innerHTML = STAGES.map(stage => {
        const state = stageState.get(stage.id) || "pending";
        const icon = state === "completed" ? "✓" : (state === "failed" || state === "blocked" ? "!" : "•");
        return `<li class="stage ${state}" data-stage="${stage.id}">
          <span class="stage-dot">${icon}</span>
          <div><div class="stage-label">${stage.label}</div><div class="stage-detail">${stage.detail}</div></div>
        </li>`;
      }).join("");
    }

    function resetRunView() {
      for (const stage of STAGES) stageState.set(stage.id, "pending");
      renderTimeline();
      resultNode.className = "";
      resultNode.textContent = "";
      logPane.textContent = "Пока записей нет.";
      logPane.classList.add("empty-log");
      logStarted = false;
      activityTitle.textContent = "Готовим запуск";
      activityDetail.textContent = "Сервер принимает описание и создаёт задачу.";
    }

    function setRunState(state, title) {
      runBadge.className = `badge ${state}`;
      runBadge.textContent = STATE_LABEL[state] || state;
      if (title) runTitle.textContent = title;
      const live = state === "running";
      submit.disabled = live;
      cancel.hidden = !live;
      if (!live) stopElapsed();
    }

    function setStage(stageId, state, detail) {
      if (!stageState.has(stageId)) return;
      stageState.set(stageId, state);
      renderTimeline();
      const stage = STAGES.find(item => item.id === stageId);
      if (state === "running") {
        activityTitle.textContent = stage.label;
        activityDetail.textContent = detail || stage.detail;
      } else if (detail) {
        activityDetail.textContent = detail;
      }
    }

    function startElapsed(value) {
      startedAt = value ? new Date(value) : new Date();
      stopElapsed();
      const tick = () => {
        const total = Math.max(0, Math.floor((Date.now() - startedAt.getTime()) / 1000));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        elapsed.textContent = `${hours ? String(hours).padStart(2, "0") + ":" : ""}${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      };
      tick();
      elapsedTimer = setInterval(tick, 1000);
    }

    function stopElapsed() {
      if (elapsedTimer) clearInterval(elapsedTimer);
      elapsedTimer = null;
    }

    function appendLog(text) {
      if (!text) return;
      if (!logStarted) {
        logPane.textContent = "";
        logPane.classList.remove("empty-log");
        logStarted = true;
      }
      logPane.textContent += text;
      if (logPane.textContent.length > 300000) logPane.textContent = logPane.textContent.slice(-250000);
      logPane.scrollTop = logPane.scrollHeight;
    }

    function renderResult(data) {
      const findings = Array.isArray(data.findings) ? data.findings : [];
      const files = Array.isArray(data.files_changed) ? data.files_changed : [];
      const checks = [];
      for (const finding of findings) {
        if (finding.red_status) checks.push(`${finding.red_status}${finding.red_test ? ` — ${finding.red_test}` : ""}`);
        if (finding.green_status) checks.push(`${finding.green_status}${finding.green_test ? ` — ${finding.green_test}` : ""}`);
        for (const regression of finding.targeted_regressions || []) checks.push(`Регрессия: ${regression}`);
      }
      const summaries = findings.map(item => item.fix_summary || item.classification_reason).filter(Boolean);
      resultNode.innerHTML = `<h3>${data.error ? "Запуск требует внимания" : "Результат исправления"}</h3>
        <div class="result-grid">
          <div class="result-item"><div class="result-key">Статус</div><div class="result-value">${escapeHtml(data.status || "UNKNOWN")}</div></div>
          <div class="result-item"><div class="result-key">Commit</div><div class="result-value">${escapeHtml(data.commit_sha || data.commit_status || "Не создан")}</div></div>
          <div class="result-item wide"><div class="result-key">Что сделано</div><div class="result-value">${escapeHtml(summaries.join("\n") || data.error || "Итог сохранён в артефактах запуска")}</div></div>
          <div class="result-item"><div class="result-key">Изменённые файлы</div><div class="result-value">${files.length ? `<ul class="file-list">${files.map(file => `<li>${escapeHtml(file)}</li>`).join("")}</ul>` : "Нет"}</div></div>
          <div class="result-item"><div class="result-key">Проверки</div><div class="result-value">${checks.length ? `<ul class="check-list">${checks.map(check => `<li>${escapeHtml(check)}</li>`).join("")}</ul>` : "Нет данных"}</div></div>
          ${data.error ? `<div class="result-item wide"><div class="result-key">Ошибка</div><div class="result-value">${escapeHtml(data.error)}</div></div>` : ""}
        </div>`;
      resultNode.className = "visible";
    }

    function parseEventData(raw) {
      try { return JSON.parse(raw); } catch (_) { return { text: raw }; }
    }

    function handleEvent(eventName, data) {
      if (eventName === "heartbeat") return;
      if (eventName === "run_started") {
        if (activeRunId !== data.run_id) resetRunView();
        activeRunId = data.run_id;
        localStorage.setItem("opsxActiveRepairRun", activeRunId);
        runIdNode.textContent = activeRunId;
        runPanel.classList.add("visible");
        setRunState("running", "Исправление выполняется");
        startElapsed(data.started_at);
        return;
      }
      if (eventName === "stage") {
        const stageId = ROLE_STAGE[String(data.stage || "").toUpperCase()];
        setStage(stageId, data.state || "running", data.detail);
        return;
      }
      if (eventName === "log") {
        appendLog(data.text || "");
        return;
      }
      if (eventName === "result") {
        setStage("finish", data.error ? "failed" : "completed", data.status || "Результат готов");
        renderResult(data);
        activityTitle.textContent = data.error ? "Нужно внимание" : "Работа завершена";
        activityDetail.textContent = data.error || `Итоговый статус: ${data.status || "UNKNOWN"}`;
        return;
      }
      if (eventName === "cancelling") {
        activityTitle.textContent = "Останавливаем запуск";
        activityDetail.textContent = data.message || "Ждём завершения активной операции.";
        cancel.disabled = true;
        return;
      }
      if (eventName === "cancelled" || eventName === "error") {
        setRunState(eventName === "cancelled" ? "cancelled" : "failed", eventName === "cancelled" ? "Запуск остановлен" : "Запуск завершился ошибкой");
        activityTitle.textContent = eventName === "cancelled" ? "Запуск остановлен" : "Произошла ошибка";
        activityDetail.textContent = data.message || "Подробности доступны в техническом журнале.";
        setStage("finish", "failed", activityDetail.textContent);
        return;
      }
      if (eventName === "done") {
        const state = data.state || "completed";
        setRunState(state, state === "completed" ? "Исправление завершено" : runTitle.textContent);
        localStorage.removeItem("opsxActiveRepairRun");
        cancel.disabled = false;
      }
    }

    function drainSseBuffer(buffer, onEvent) {
      let rest = buffer;
      for (;;) {
        const sep = rest.indexOf("\n\n");
        if (sep < 0) break;
        const block = rest.slice(0, sep);
        rest = rest.slice(sep + 2);
        let eventName = "message";
        const dataLines = [];
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) eventName = line.slice(6).trim();
          else if (line.startsWith("data:")) dataLines.push(line.slice(5).replace(/^\s/, ""));
        }
        onEvent(eventName, parseEventData(dataLines.join("\n")));
      }
      return rest;
    }

    async function consumeStream(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (value) buffer += decoder.decode(value, { stream: !done }).replace(/\r\n/g, "\n");
        buffer = drainSseBuffer(buffer, handleEvent);
        if (done) break;
      }
      if (buffer) drainSseBuffer(buffer + "\n\n", handleEvent);
    }

    async function connectToRun(runId) {
      if (!runId) return;
      if (streamAbort) streamAbort.abort();
      streamAbort = new AbortController();
      activeRunId = runId;
      runIdNode.textContent = runId;
      runPanel.classList.add("visible");
      setRunState("running", "Восстанавливаем запуск");
      try {
        const response = await fetch(`/runs/${encodeURIComponent(runId)}/events`, { signal: streamAbort.signal });
        if (response.status === 404) {
          localStorage.removeItem("opsxActiveRepairRun");
          setRunState("failed", "Запуск больше не доступен");
          return;
        }
        if (!response.ok) throw new Error(await response.text());
        await consumeStream(response);
      } catch (error) {
        if (error.name !== "AbortError") {
          activityTitle.textContent = "Связь с запуском потеряна";
          activityDetail.textContent = String(error);
        }
        sseBuffer = drainSseBuffer(sseBuffer + "\n\n", (eventName, data) => {
          if (eventName === "done") return;
          logPane.textContent += data;
          logPane.scrollTop = logPane.scrollHeight;
        });
      } catch (err) {
        if (err.name === "AbortError") return;
        const hint =
          "Поток оборвался (обновите страницу или подождите). " +
          "Repair мог продолжиться в фоне на сервере — смотрите stderr терминала UI.\n";
        logPane.textContent += hint + String(err);
      } finally {
        submit.disabled = false;
      }
    });

    cancel.addEventListener("click", async () => {
      if (!activeRunId || !confirm("Остановить активное исправление?")) return;
      cancel.disabled = true;
      try {
        const response = await fetch(`/runs/${encodeURIComponent(activeRunId)}/cancel`, { method: "POST" });
        if (!response.ok && response.status !== 409) throw new Error(await response.text());
      } catch (error) {
        cancel.disabled = false;
        activityDetail.textContent = `Не удалось остановить: ${error}`;
      }
    });

    async function restoreRun() {
      renderTimeline();
      const remembered = localStorage.getItem("opsxActiveRepairRun");
      try {
        const response = await fetch("/runs/active");
        const payload = response.ok ? await response.json() : { run: null };
        const runId = payload.run?.run_id || remembered;
        if (runId) await connectToRun(runId);
      } catch (_) {
        if (remembered) await connectToRun(remembered);
      }
    }

    restoreRun();
  </script>
</body>
</html>
